<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Atölye | Sanat ve Günlük Plan</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:#292d29;background:#1b211f}button,input{font:inherit}button{cursor:pointer}#app{height:100vh;height:100dvh;display:flex;gap:12px;padding:12px;background:#d7d0c4}#art{position:relative;flex:65;min-width:0;overflow:hidden;background:#33443e;cursor:pointer}#painting,#painting svg{width:100%;height:100%;display:block}#painting svg{object-fit:cover}#shade{pointer-events:none;position:absolute;inset:0;background:linear-gradient(0deg,#0008,transparent 35%)}#artInfo{pointer-events:none;position:absolute;bottom:22px;left:25px;color:#fff;text-shadow:0 1px 8px #0008}#artTitle{font:normal clamp(20px,3vw,38px) Georgia,serif}#artSub{font-size:12px;letter-spacing:.1em;margin-top:5px}#next{position:absolute;right:16px;bottom:16px;background:#0007;color:white;border:1px solid #fffa;padding:9px 14px;border-radius:22px}#panel{flex:35;min-width:0;background:#f1eee7;padding:22px;overflow:auto;cursor:pointer;display:flex;flex-direction:column}#date{font-size:12px;color:#6d746a;letter-spacing:.08em;text-transform:uppercase}#clock{font:normal clamp(36px,5vw,70px) Georgia,serif;margin:5px 0 0}h2{font:normal 25px Georgia,serif;margin:22px 0 10px}.task{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #ddd9cf;font-size:15px}.task input{width:18px;height:18px;accent-color:#63765e}.done span{text-decoration:line-through;color:#8b8b86}.entry{display:flex;gap:7px;margin-top:13px}.entry input{width:100%;min-width:0;padding:10px;border:1px solid #ccc8bc;background:#fff;border-radius:5px}.entry button,.smallbtn{background:#596d58;color:#fff;border:0;border-radius:5px;padding:9px 13px}.event{border-bottom:1px solid #ddd9cf;padding:9px 0;font-size:14px}.event small{display:block;color:#777;margin-bottom:4px}.note{color:#777;font-size:11px;margin-top:auto;padding-top:18px}.hint{font-size:11px;color:#6b756c;margin-top:9px}#back{display:none;position:fixed;right:19px;top:19px;z-index:10;background:#263a32;color:#fff;border:1px solid #fff5;padding:11px 16px;border-radius:25px;box-shadow:0 2px 10px #0003}#app.art-only{padding:0;gap:0}#app.art-only #art{flex:1}#app.art-only #panel{display:none}#app.plan-only{padding:0;gap:0}#app.plan-only #art{display:none}#app.plan-only #panel{flex:1;padding:5vh 9vw;max-width:none}#app.plan-only #panelContent{max-width:850px;width:100%;margin:auto}#app.plan-only #clock{font-size:70px}#app.plan-only h2{font-size:32px}#app.plan-only .task,#app.plan-only .event{font-size:20px}#app.plan-only .note{margin-top:25px}#app.art-only~#back,#app.plan-only~#back{display:block}@media(max-width:700px){#app{gap:7px;padding:7px}#panel{padding:12px}#clock{font-size:30px}h2{font-size:18px;margin:14px 0 6px}.task,.event{font-size:12px;padding:6px 0}.entry input{font-size:12px;padding:6px}.entry button{padding:6px 9px}#artInfo{left:12px;bottom:13px}#artTitle{font-size:19px}#artSub{font-size:9px}#next{bottom:10px;right:10px;padding:6px 9px;font-size:11px}}
</style></head><body><div id="app"><main id="art" aria-label="Sanatı tam ekran göster"><div id="painting"></div><div id="shade"></div><div id="artInfo"><div id="artTitle"></div><div id="artSub"></div></div><button id="next" aria-label="Sonraki eser">Sonraki eser ›</button></main><aside id="panel" aria-label="Takvimi tam ekran göster"><div id="panelContent"><div id="date"></div><div id="clock"></div><h2>Yapılacaklar</h2><div id="tasks"></div><div class="entry"><input id="newTask" placeholder="Yeni görev ekle" maxlength="90"><button id="add">+</button></div><h2>Takvim</h2><div id="events"><div class="event"><small>Örnek · 10:00</small>Günün planını gözden geçir</div><div class="event"><small>Örnek · 18:30</small>Kitap ve dinlenme</div></div><div class="hint">Takvim alanına dokun: büyüt • Sanata dokun: tabloyu büyüt</div><div class="note">Demo sürümü: Apple Takvim ve Anımsatıcılar henüz bağlı değil. Görevler bu tarayıcıda saklanır.</div></div></aside></div><button id="back">↙ Hibrit ekrana dön</button><script>
(function(){'use strict';var artworks=[{title:'Akşamın Sessizliği',sub:'Özgün dijital manzara · 01',svg:'<svg viewBox="0 0 900 650" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="s" x2="0" y2="1"><stop stop-color="#b9bca5"/><stop offset=".58" stop-color="#e7c5a0"/><stop offset="1" stop-color="#d4b18a"/></linearGradient><linearGradient id="w" x2="0" y2="1"><stop stop-color="#778e85"/><stop offset="1" stop-color="#334e52"/></linearGradient></defs><rect width="900" height="650" fill="url(#s)"/><circle cx="630" cy="220" r="83" fill="#f8dbac" opacity=".78"/><path d="M0 350 Q180 200 360 355 T900 300 V650 H0" fill="#9da898"/><path d="M0 425 Q210 320 410 425 T900 380 V650 H0" fill="#657f76"/><path d="M0 470 Q240 420 450 470 T900 430 V650 H0" fill="url(#w)"/><path d="M0 520 Q230 480 480 515 T900 485" stroke="#dfbd94" stroke-width="8" opacity=".4" fill="none"/><g fill="#263c38"><path d="M85 650 L106 270 L118 650Z"/><path d="M0 340 Q120 130 280 295 Q160 260 0 410Z"/><path d="M15 255 Q135 75 330 235 Q190 220 15 330Z"/><path d="M770 650 L792 230 L808 650Z"/><path d="M650 250 Q785 80 900 225 V310 Q775 205 650 310Z"/></g><g stroke="#c3bfa4" opacity=".3"><path d="M100 565h290M470 555h330M220 590h250M570 610h190"/></g></svg>'},{title:'Bahçede Sabah',sub:'Özgün dijital botanik çalışma · 02',svg:'<svg viewBox="0 0 900 650" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><rect width="900" height="650" fill="#d9cdb2"/><path d="M0 450 Q300 280 900 390V650H0" fill="#a2aa83"/><path d="M0 540 Q400 410 900 525V650H0" fill="#687d61"/><circle cx="650" cy="150" r="94" fill="#e9ddae"/><g stroke="#435c4a" stroke-width="12" fill="none" stroke-linecap="round"><path d="M330 700Q360 400 310 110M330 510Q200 340 130 240M345 450Q490 330 545 210M335 600Q530 510 680 450"/></g><g fill="#667f60"><ellipse cx="220" cy="320" rx="110" ry="36" transform="rotate(25 220 320)"/><ellipse cx="415" cy="280" rx="120" ry="37" transform="rotate(-38 415 280)"/><ellipse cx="220" cy="480" rx="125" ry="42" transform="rotate(40 220 480)"/><ellipse cx="520" cy="490" rx="120" ry="38" transform="rotate(-23 520 490)"/></g><g fill="#f2e6c9"><circle cx="310" cy="160" r="38"/><circle cx="540" cy="215" r="33"/><circle cx="135" cy="245" r="29"/><circle cx="675" cy="445" r="39"/></g><g fill="#c8a77c"><circle cx="310" cy="160" r="12"/><circle cx="540" cy="215" r="10"/><circle cx="135" cy="245" r="10"/><circle cx="675" cy="445" r="12"/></g></svg>'},{title:'Mavi Ufuk',sub:'Özgün dijital soyut eser · 03',svg:'<svg viewBox="0 0 900 650" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><rect width="900" height="650" fill="#d3d8cf"/><rect x="0" y="0" width="900" height="350" fill="#aebfbc"/><circle cx="570" cy="250" r="115" fill="#e5d4ae"/><path d="M0 330Q240 270 440 335T900 320V650H0" fill="#6b9295"/><path d="M0 415Q200 370 420 420T900 385V650H0" fill="#416e78"/><path d="M0 520Q280 460 530 510T900 485V650H0" fill="#294b59"/><path d="M0 590Q250 540 500 585T900 565" stroke="#b2c0b4" stroke-width="8" fill="none" opacity=".5"/><path d="M80 280Q240 245 390 280" stroke="#f3e8cf" stroke-width="5" fill="none" opacity=".7"/></svg>'}];var app=document.getElementById('app'),mode='hybrid',timer=null,artIndex=0;function setMode(next){mode=next;app.className=next==='hybrid'?'':next==='art'?'art-only':'plan-only';document.getElementById('back').style.display=next==='hybrid'?'none':'block';clearTimeout(timer);if(next!=='hybrid')timer=setTimeout(function(){setMode('hybrid')},120000)}function activity(){if(mode!=='hybrid'){clearTimeout(timer);timer=setTimeout(function(){setMode('hybrid')},120000)}}document.getElementById('art').addEventListener('click',function(){if(mode==='hybrid')setMode('art');else activity()});document.getElementById('panel').addEventListener('click',function(e){if(e.target.closest('button,input,label')){activity();return}if(mode==='hybrid')setMode('plan');else activity()});document.getElementById('back').onclick=function(){setMode('hybrid')};function showArt(){var a=artworks[artIndex];document.getElementById('painting').innerHTML=a.svg;document.getElementById('artTitle').textContent=a.title;document.getElementById('artSub').textContent=a.sub}document.getElementById('next').onclick=function(e){e.stopPropagation();artIndex=(artIndex+1)%artworks.length;showArt();activity()};function clock(){var d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});document.getElementById('date').textContent=d.toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}var tasks;try{tasks=JSON.parse(localStorage.getItem('artframe_tasks')||'null')}catch(e){}if(!Array.isArray(tasks))tasks=[{text:'Bugünün önceliklerini belirle',done:false},{text:'Biraz kitap oku',done:false},{text:'Kendine zaman ayır',done:false}];function save(){try{localStorage.setItem('artframe_tasks',JSON.stringify(tasks))}catch(e){}}function render(){var root=document.getElementById('tasks');root.innerHTML='';tasks.forEach(function(t,i){var line=document.createElement('label');line.className='task'+(t.done?' done':'');var cb=document.createElement('input');cb.type='checkbox';cb.checked=!!t.done;cb.onchange=function(){tasks[i].done=cb.checked;save();render();activity()};var span=document.createElement('span');span.textContent=t.text;line.appendChild(cb);line.appendChild(span);root.appendChild(line)})}function add(){var el=document.getElementById('newTask'),val=el.value.trim();if(!val)return;tasks.push({text:val,done:false});el.value='';save();render();activity()}document.getElementById('add').onclick=add;document.getElementById('newTask').onkeydown=function(e){if(e.key==='Enter')add()};document.addEventListener('touchstart',activity,{passive:true});showArt();render();clock();setInterval(clock,1000);setInterval(function(){artIndex=(artIndex+1)%artworks.length;showArt()},300000)})();
</script></body></html>
