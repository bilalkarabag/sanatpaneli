<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Atölye v5 | Sanat ve Günlük Plan</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:#292d29;background:#1b211f}button,input{font:inherit}button{cursor:pointer}#app{height:100vh;height:100dvh;display:flex;gap:12px;padding:12px;background:#d7d0c4}#art{position:relative;flex:80;min-width:0;overflow:hidden;background:#33443e;cursor:pointer}#painting{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#252b29}#painting img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block}#painting .loading{color:#ddd6c9;font:17px Georgia,serif;text-align:center;padding:24px}#shade{pointer-events:none;position:absolute;inset:0;background:linear-gradient(0deg,#0008,transparent 35%)}#artInfo{pointer-events:none;position:absolute;bottom:22px;left:25px;color:#fff;text-shadow:0 1px 8px #0008}#artTitle{font:normal clamp(20px,3vw,38px) Georgia,serif}#artSub{font-size:12px;letter-spacing:.1em;margin-top:5px}#next{position:absolute;right:16px;bottom:16px;background:#0007;color:white;border:1px solid #fffa;padding:9px 14px;border-radius:22px}#panel{flex:20;min-width:0;background:#f1eee7;padding:22px;overflow:auto;cursor:pointer;display:flex;flex-direction:column}#date{font-size:12px;color:#6d746a;letter-spacing:.08em;text-transform:uppercase}#clock{font:normal clamp(36px,5vw,70px) Georgia,serif;margin:5px 0 0}h2{font:normal 25px Georgia,serif;margin:22px 0 10px}.task{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #ddd9cf;font-size:15px}.task input{width:18px;height:18px;accent-color:#63765e}.done span{text-decoration:line-through;color:#8b8b86}.entry{display:flex;gap:7px;margin-top:13px}.entry input{width:100%;min-width:0;padding:10px;border:1px solid #ccc8bc;background:#fff;border-radius:5px}.entry button,.smallbtn{background:#596d58;color:#fff;border:0;border-radius:5px;padding:9px 13px}.event{border-bottom:1px solid #ddd9cf;padding:9px 0;font-size:14px}.event small{display:block;color:#777;margin-bottom:4px}.note{color:#777;font-size:11px;margin-top:auto;padding-top:18px}.hint{font-size:11px;color:#6b756c;margin-top:9px}#back{display:none;position:fixed;right:19px;top:19px;z-index:10;background:#263a32;color:#fff;border:1px solid #fff5;padding:11px 16px;border-radius:25px;box-shadow:0 2px 10px #0003}#app.art-only{padding:0;gap:0}#app.art-only #art{flex:1}#app.art-only #panel{display:none}#app.plan-only{padding:0;gap:0}#app.plan-only #art{display:none}#app.plan-only #panel{flex:1;padding:5vh 9vw;max-width:none}#app.plan-only #panelContent{max-width:850px;width:100%;margin:auto}#app.plan-only #clock{font-size:70px}#app.plan-only h2{font-size:32px}#app.plan-only .task,#app.plan-only .event{font-size:20px}#app.plan-only .note{margin-top:25px}#app.art-only~#back,#app.plan-only~#back{display:block}@media(max-width:700px){#app{gap:7px;padding:7px}#panel{padding:12px}#clock{font-size:30px}h2{font-size:18px;margin:14px 0 6px}.task,.event{font-size:12px;padding:6px 0}.entry input{font-size:12px;padding:6px}.entry button{padding:6px 9px}#artInfo{left:12px;bottom:13px}#artTitle{font-size:19px}#artSub{font-size:9px}#next{bottom:10px;right:10px;padding:6px 9px;font-size:11px}}
</style></head><body><div id="app"><main id="art" aria-label="Sanatı tam ekran göster"><div id="painting"></div><div id="shade"></div><div id="artInfo"><div id="artTitle"></div><div id="artSub"></div></div><button id="next" aria-label="Sonraki eser">Sonraki eser ›</button></main><aside id="panel" aria-label="Takvimi tam ekran göster"><div id="panelContent"><div id="date"></div><div id="clock"></div><h2>Yapılacaklar</h2><div id="tasks"></div><div class="entry"><input id="newTask" placeholder="Yeni görev ekle" maxlength="90"><button id="add">+</button></div><h2>Takvim</h2><div id="events"><div class="event"><small>Örnek · 10:00</small>Günün planını gözden geçir</div><div class="event"><small>Örnek · 18:30</small>Kitap ve dinlenme</div></div><div class="hint">Takvim alanına dokun: büyüt • Sanata dokun: tabloyu büyüt</div><div class="note">v5: Sanat eserleri müzenin açık koleksiyonundan gelir. Apple Takvim ve Anımsatıcılar henüz bağlı değil. Görevler bu tarayıcıda saklanır.</div></div></aside></div><button id="back">↙ Hibrit ekrana dön</button><script>
(function(){'use strict';var artworks=[],artIndex=0;var seedIds=[27992,28560,24645];var searches=['Claude Monet','Vincent van Gogh','Pierre-Auguste Renoir','Gustave Caillebotte','Georges Seurat','Katsushika Hokusai','Camille Pissarro'];var fallbackArt=[{title:'La Grande Jatte',artist:'Georges Seurat',year:'1884–1886',id:27992},{title:'The Bedroom',artist:'Vincent van Gogh',year:'1889',id:28560},{title:'The Great Wave',artist:'Katsushika Hokusai',year:'1830–1833',id:24645}];function api(url){return fetch(url).then(function(r){if(!r.ok)throw Error('HTTP '+r.status);return r.json()})}function addArt(a){if(!a||!a.is_public_domain||!a.image_id||artworks.some(function(x){return x.id===a.id}))return;artworks.push({id:a.id,title:a.title||'İsimsiz eser',artist:a.artist_title||'Bilinmeyen sanatçı',year:a.date_display||'',image:'https://www.artic.edu/iiif/2/'+a.image_id+'/full/1200,/0/default.jpg'});}function loadCollection(){document.getElementById('painting').innerHTML='<div class="loading">Müze koleksiyonu yükleniyor…</div>';api('https://api.artic.edu/api/v1/artworks?ids='+seedIds.join(',')+'&fields=id,title,artist_title,date_display,image_id,is_public_domain').then(function(j){(j.data||[]).forEach(addArt);if(artworks.length)showArt();}).catch(function(){document.getElementById('painting').innerHTML='<div class="loading">Müze bağlantısı kurulamadı. İnternet bağlantısını kontrol edip sayfayı yenile.</div>'});searches.forEach(function(q){api('https://api.artic.edu/api/v1/artworks/search?q='+encodeURIComponent(q)+'&limit=12&fields=id,title,artist_title,date_display,image_id,is_public_domain').then(function(j){var matches=(j.data||[]).filter(function(a){return a.is_public_domain&&a.image_id&&(a.artist_title||'').toLowerCase().indexOf(q.toLowerCase())!==-1});matches.slice(0,3).forEach(addArt);if(artworks.length&&!document.getElementById('painting').querySelector('img'))showArt()}).catch(function(){})})};var app=document.getElementById('app'),mode='hybrid',timer=null;function setMode(next){mode=next;app.className=next==='hybrid'?'':next==='art'?'art-only':'plan-only';document.getElementById('back').style.display=next==='hybrid'?'none':'block';clearTimeout(timer);if(next!=='hybrid')timer=setTimeout(function(){setMode('hybrid')},120000)}function activity(){if(mode!=='hybrid'){clearTimeout(timer);timer=setTimeout(function(){setMode('hybrid')},120000)}}document.getElementById('art').addEventListener('click',function(){if(mode==='hybrid')setMode('art');else activity()});document.getElementById('panel').addEventListener('click',function(e){if(e.target.closest('button,input,label')){activity();return}if(mode==='hybrid')setMode('plan');else activity()});document.getElementById('back').onclick=function(){setMode('hybrid')};function showArt(){if(!artworks.length)return;artIndex=artIndex%artworks.length;var a=artworks[artIndex],root=document.getElementById('painting');root.innerHTML='';var img=document.createElement('img');img.alt=a.title+' — '+a.artist;img.src=a.image;img.onerror=function(){root.innerHTML='<div class="loading">Görsel yüklenemedi. Sonraki eseri deneyin.</div>'};root.appendChild(img);document.getElementById('artTitle').textContent=a.title;document.getElementById('artSub').textContent=a.artist+(a.year?' · '+a.year:'')+' · Art Institute of Chicago'}document.getElementById('next').onclick=function(e){e.stopPropagation();if(artworks.length){artIndex=(artIndex+1)%artworks.length;showArt()}activity()};function clock(){var d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});document.getElementById('date').textContent=d.toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}var tasks;try{tasks=JSON.parse(localStorage.getItem('artframe_tasks')||'null')}catch(e){}if(!Array.isArray(tasks))tasks=[{text:'Bugünün önceliklerini belirle',done:false},{text:'Biraz kitap oku',done:false},{text:'Kendine zaman ayır',done:false}];function save(){try{localStorage.setItem('artframe_tasks',JSON.stringify(tasks))}catch(e){}}function render(){var root=document.getElementById('tasks');root.innerHTML='';tasks.forEach(function(t,i){var line=document.createElement('label');line.className='task'+(t.done?' done':'');var cb=document.createElement('input');cb.type='checkbox';cb.checked=!!t.done;cb.onchange=function(){tasks[i].done=cb.checked;save();render();activity()};var span=document.createElement('span');span.textContent=t.text;line.appendChild(cb);line.appendChild(span);root.appendChild(line)})}function add(){var el=document.getElementById('newTask'),val=el.value.trim();if(!val)return;tasks.push({text:val,done:false});el.value='';save();render();activity()}document.getElementById('add').onclick=add;document.getElementById('newTask').onkeydown=function(e){if(e.key==='Enter')add()};document.addEventListener('touchstart',activity,{passive:true});loadCollection();render();clock();setInterval(clock,1000);setInterval(function(){if(artworks.length){artIndex=(artIndex+1)%artworks.length;showArt()}},900000)})();
</script></body></html>
